[project]
name = "super-img2ppt-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["super-img2ppt"]

[tool.uv.sources]
super-img2ppt = { workspace = true }

[tool.uv.workspace]
members = ["skills/super-img2ppt"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "PyYAML>=6.0.2,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: real LibreOffice export and PDF text validation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
